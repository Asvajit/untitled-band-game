<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Loose Wires — On Tour (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=VT323&display=swap" rel="stylesheet">
<style>
  :root { --ink:#fff6e8; --pink:#ff6ad5; --cyan:#5ff3ff; --amber:#ffb347; --bg:#140f1a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#000; color:var(--ink); font-family:'VT323', monospace; }
  canvas#game { position:fixed; inset:0; width:100%; height:100%; display:block; image-rendering:pixelated; }
  canvas#rhythm { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }
  #rainglass { position:fixed; inset:0; pointer-events:none; display:none; }
  #rainglass canvas { width:100%; height:100%; image-rendering:pixelated; }
  .hud { position:fixed; pointer-events:none; text-shadow:0 2px 0 #000, 0 0 8px rgba(0,0,0,.6); }
  #obj { top:14px; left:16px; max-width:min(440px, 60vw); font-size:22px; line-height:1.05; background:rgba(20,15,26,.55); padding:8px 12px; border-left:4px solid var(--amber); }
  #obj b { font-family:'Bungee', sans-serif; font-size:13px; letter-spacing:1px; color:var(--amber); font-weight:normal; }
  #obj.pulse { animation: pulse .9s ease-out; }
  @keyframes pulse { 0%{ transform:scale(1.06); background:rgba(255,179,71,.45);} 100%{ transform:scale(1);} }
  #status { top:14px; right:16px; text-align:right; font-size:21px; line-height:1.15; background:rgba(20,15,26,.55); padding:8px 12px; border-right:4px solid var(--cyan); }
  #status small { opacity:.7; }
  #rolename { top:14px; left:50%; transform:translateX(-50%); font-family:'Bungee', sans-serif; font-size:12px; letter-spacing:2px; opacity:.75; }
  #toast { top:20%; left:50%; transform:translateX(-50%); font-size:30px; text-align:center; max-width:80vw; transition:opacity .4s; opacity:0; color:#fff; }
  #prompt { top:calc(50% + 16px); left:50%; transform:translateX(-50%); font-size:22px; transition:opacity .12s; opacity:0; white-space:nowrap; max-width:96vw; overflow:hidden; text-overflow:ellipsis; }
  #prompt kbd { background:transparent; color:#fff; border:2px solid #fff; border-radius:4px; padding:0 5px; margin-right:8px; }
  kbd { font-family:'VT323', monospace; background:#ffe066; color:#140f1a; padding:0 6px; border-radius:3px; margin-right:4px; }
  #help { bottom:12px; left:16px; font-size:19px; opacity:.85; max-width:80vw; }
  #gearbox { bottom:60px; right:40px; display:none; }
  #legend { bottom:44px; left:16px; display:none; gap:10px; font-size:21px; align-items:stretch; }
  #legend .gcol { display:flex; flex-direction:column; justify-content:space-between; background:rgba(20,15,26,.45); padding:4px 8px; font-family:'Bungee',sans-serif; font-size:15px; color:rgba(255,255,255,.45); }
  #legend .gcol .on { color:#ff9a3a; text-shadow:0 0 8px rgba(255,154,58,.7); }
  #legend .lkeys { display:flex; flex-direction:column; gap:4px; justify-content:center; }
  #legend .lrow kbd { background:transparent; color:#fff; border:2px solid #fff; border-radius:4px; padding:0 5px; margin-right:8px; font-size:18px; }
  #legend .lrow.hot { color:#ff9a3a; } #legend .lrow.hot kbd { border-color:#ff9a3a; color:#ff9a3a; }
  #legend .lrow.hot2 { color:#ff5a5a; } #legend .lrow.hot2 kbd { border-color:#ff5a5a; color:#ff5a5a; }
  #legend .lrow.held { color:#a8ff7a; } #legend .lrow.held kbd { border-color:#a8ff7a; color:#a8ff7a; }
  body.perf #gearbox, body.perf #legend { display:none !important; }
  #inset { position:fixed; top:14px; right:14px; width:512px; height:288px; border:3px solid #ff6ad5; box-shadow:0 0 0 3px #140f1a, 0 0 18px rgba(255,106,213,.4); pointer-events:none; display:none; z-index:5; }
  #inset span { position:absolute; left:6px; top:4px; font-family:'Bungee',sans-serif; font-size:13px; letter-spacing:2px; color:#fff; background:rgba(20,15,26,.7); padding:1px 6px; }
  body.perf.gig #prompt, body.perf.gig #crosshair, body.perf.gig #toast { display:block !important; }
  body.perf.gig #toast { top:62%; font-size:24px; }
  #crosshair { top:50%; left:50%; width:6px; height:6px; margin:-3px 0 0 -3px; background:#fff; border-radius:50%; box-shadow:0 0 0 2px rgba(0,0,0,.5); display:none; }
  #lockhint { top:58%; left:50%; transform:translateX(-50%); font-size:22px; background:rgba(20,15,26,.75); padding:4px 12px; display:none; }
  body.perf #prompt, body.perf #help, body.perf #status, body.perf #rolename, body.perf #toast, body.perf #crosshair, body.perf #obj, body.perf #lockhint { display:none !important; }
  body:not(.playing) .hud { display:none; }
  #dbgbtn { position:fixed; bottom:12px; right:12px; z-index:30; font-family:'VT323', monospace; font-size:18px; background:rgba(20,15,26,.75); color:#d8ff9e; border:1px solid #d8ff9e; padding:2px 10px; cursor:pointer; }
  /* overlays */
  .overlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(10,6,14,.62); z-index:20; }
  .overlay.show { display:flex; }
  .card { background:#1d1622; border:3px solid var(--pink); box-shadow:0 0 0 6px #140f1a, 0 0 40px rgba(255,106,213,.35); padding:22px 26px; max-width:min(720px, 94vw); max-height:92vh; overflow:auto; text-align:center; }
  .card h1 { font-family:'Bungee', sans-serif; font-weight:normal; color:var(--pink); margin:0 0 6px; font-size:34px; text-shadow:0 0 14px rgba(255,106,213,.6); }
  .card h3 { font-family:'Bungee', sans-serif; font-weight:normal; color:var(--cyan); font-size:14px; letter-spacing:2px; margin:16px 0 6px; }
  .sub { opacity:.8; font-size:20px; margin:4px 0 12px; }
  .btns { display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
  button { font-family:'VT323', monospace; font-size:22px; cursor:pointer; }
  .btns button, #go { background:var(--amber); color:#140f1a; border:none; padding:8px 18px; box-shadow:0 4px 0 #9a5a1a; }
  .btns button:disabled { opacity:.4; cursor:default; }
  .btns button:active, #go:active { transform:translateY(3px); box-shadow:0 1px 0 #9a5a1a; }
  .songs { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .song { position:relative; background:#2a2030; color:#fff; border:2px solid #4a3a55; padding:12px 10px; text-align:left; display:flex; flex-direction:column; gap:2px; }
  .song b { font-family:'Bungee', sans-serif; font-weight:normal; font-size:15px; }
  .song.on { border-color:var(--cyan); background:#1f3036; }
  .song .n { position:absolute; top:6px; right:10px; font-family:'Bungee'; color:var(--cyan); font-size:20px; }
  .stars { font-size:46px; color:#ffe066; letter-spacing:4px; text-shadow:0 0 12px rgba(255,224,102,.6); }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:10px 0; }
  .grid div { background:#2a2030; padding:8px; font-size:18px; }
  .grid b { display:block; font-size:30px; color:var(--cyan); font-weight:normal; }
  .brow { display:flex; justify-content:space-between; font-size:21px; padding:2px 30px; }
  .earn { font-family:'Bungee'; color:#a8ff7a; font-size:22px; margin-top:12px; }
  #map .card { padding:12px; border-color:#c9b98a; }
  #map .sub { margin:6px 0 0; }
  /* title */
  #title { position:fixed; inset:0; z-index:25; display:flex; align-items:safe center; justify-content:center; overflow-y:auto; background:radial-gradient(ellipse at center, rgba(20,15,26,.35), rgba(20,15,26,.88)); }
  .tcard { text-align:center; max-width:min(980px, 96vw); padding:10px; }
  .tcard h1 { font-family:'Bungee', sans-serif; font-weight:normal; font-size:clamp(34px, 7vw, 76px); margin:0; color:var(--pink); text-shadow:0 0 22px rgba(255,106,213,.7), 0 6px 0 #5a1a4a; line-height:1; }
  .tcard h2 { font-family:'Bungee', sans-serif; font-weight:normal; font-size:16px; letter-spacing:6px; color:var(--cyan); margin:6px 0 4px; }
  .roles { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin:16px 0; }
  .role { background:rgba(29,22,34,.92); color:#fff; border:2px solid #3a2f44; padding:12px; text-align:left; display:flex; flex-direction:column; gap:2px; border-left:6px solid var(--c); }
  .role b { font-family:'Bungee', sans-serif; font-weight:normal; font-size:18px; color:var(--c); }
  .role span { font-size:18px; opacity:.85; }
  .role small { font-size:17px; opacity:.65; }
  .role.on { border-color:var(--c); background:rgba(60,45,70,.95); box-shadow:0 0 18px color-mix(in srgb, var(--c) 50%, transparent); }
  #go { font-size:28px; padding:10px 30px; font-family:'Bungee', sans-serif; }
  .names { display:flex; gap:12px; justify-content:center; margin:10px 0 4px; flex-wrap:wrap; }
  .names label { display:flex; flex-direction:column; text-align:left; font-family:'Bungee',sans-serif; font-size:12px; letter-spacing:2px; color:var(--cyan); }
  .names input { font-family:'VT323',monospace; font-size:24px; background:rgba(29,22,34,.92); color:#fff; border:2px solid #3a2f44; padding:4px 10px; width:260px; margin-top:4px; outline:none; }
  .names input:focus { border-color:var(--pink); }
  .note { opacity:.7; font-size:18px; margin-top:14px; }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Bungee', sans-serif; color:var(--pink); background:#140f1a; z-index:40; font-size:24px; letter-spacing:3px; }
  /* debug */
  #debug { position:fixed; top:0; right:0; bottom:0; width:min(400px, 92vw); background:rgba(14,12,18,.94); border-left:2px solid #d8ff9e; z-index:35; overflow-y:auto; padding:10px 12px 40px; display:none; font-size:17px; }
  #debug.show { display:block; }
  .dh { font-family:'Bungee', sans-serif; color:#d8ff9e; font-size:16px; margin-bottom:8px; }
  .dh small { font-family:'VT323'; opacity:.6; }
  .drow { margin:8px 0; border-top:1px solid #2a2a30; padding-top:6px; }
  .drow > label { display:block; color:#d8ff9e; font-size:15px; letter-spacing:1px; text-transform:uppercase; margin-bottom:4px; }
  .dk { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
  .dk button { font-size:17px; background:#2a2a33; color:#fff; border:1px solid #4a4a55; padding:2px 8px; }
  .dk button:hover { border-color:#d8ff9e; }
  .ck { font-size:17px; display:flex; align-items:center; gap:4px; margin-right:8px; }
  .sl { display:flex; flex-direction:column; font-size:16px; width:100%; }
  .sl input { width:100%; }
  #dbgro { font-size:15px; line-height:1.15; white-space:pre-wrap; color:#bfe; background:#0a0a0e; padding:6px; margin-top:10px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="rhythm"></canvas>
<div id="rainglass"><canvas id="raincan"></canvas></div>
<div id="obj" class="hud"></div>
<div id="rolename" class="hud"></div>
<div id="status" class="hud"></div>
<div id="toast" class="hud"></div>
<div id="prompt" class="hud"></div>
<div id="help" class="hud"></div>
<div id="crosshair" class="hud"></div>
<canvas id="gearbox" class="hud" width="170" height="170"></canvas>
<div id="legend" class="hud"></div>
<div id="inset"><span id="insetlbl">BAND CAM</span></div>
<div id="lockhint" class="hud">Click to look around</div>
<button id="dbgbtn" onclick="window.dispatchEvent(new KeyboardEvent('keydown',{code:'Backquote'}))">DEBUG `</button>
<div id="title"></div>
<div id="map" class="overlay"><div class="card"><canvas id="mapcan" width="600" height="600"></canvas><p class="sub">M or Esc to close</p></div></div>
<div id="setlist" class="overlay"></div>
<div id="results" class="overlay"></div>
<div id="editor" class="overlay"></div>
<div id="debug"></div>
<div id="loading">LOADING THE TOUR…</div>
